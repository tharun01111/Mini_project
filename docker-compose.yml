version: '3.8'

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:15-alpine
    container_name: symposium_postgres
    restart: always
    environment:
      POSTGRES_USER: symposium_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: symposium_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Express API Backend Server ──
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: symposium_server
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://symposium_admin:${POSTGRES_PASSWORD}@postgres:5432/symposium_db?schema=public"
      DIRECT_URL: "postgresql://symposium_admin:${POSTGRES_PASSWORD}@postgres:5432/symposium_db?schema=public"
      JWT_SECRET: "${JWT_SECRET}"
      CLIENT_URL: "http://localhost:80"
    ports:
      - "5000:5000"

  # ── React/Vite Frontend Web Client ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: symposium_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
